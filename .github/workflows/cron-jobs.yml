name: Scheduled Tasks

on:
  workflow_dispatch: # Manual fallback; Vercel Cron is the scheduled runner

jobs:
  daily-tasks:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
    steps:
      - name: Run Daily Tasks (Refresh Users + Update Ranks)
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/cron/daily-tasks" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

  save-monthly-winners:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Save Monthly Winners
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/cron/save-monthly-winners" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
